name: Build Kivy APK

# Когда запускать:
on:
  # Автоматически при загрузке кода в ветку main
  push:
    branches: [ main ]
  # Ручной запуск из интерфейса GitHub
  workflow_dispatch:

# Что делать:
jobs:
  build:
    # Используем свежий Ubuntu
    runs-on: ubuntu-latest
    
    steps:
      # 1. Скачать код из репозитория
      - name: Проверка кода
        uses: actions/checkout@v4

      # 2. Установить Python
      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 3. Установить системные зависимости (нужны для сборки Android)
      - name: Установка системных зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      # 4. Установить Buildozer (инструмент сборки APK)
      - name: Установка Buildozer
        run: |
          pip install buildozer

      # 5. Собрать APK (первая сборка долгая, т.к. скачивается SDK)
      - name: Сборка APK
        run: buildozer -v android debug

      # 6. Сохранить APK как артефакт (чтобы можно было скачать)
      - name: Загрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk
          path: bin/*.apk